# The URL the site will be built for
base_url = "https://sakthic.me"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "tabi"
title = "Sakthivel's Internet Home"

[markdown]
external_links_class = "external"

[markdown.highlighting]
# Themes list - https://textmate-grammars-themes.netlify.app/
theme = "catppuccin-mocha"
style = "class"

[extra]
# Put all your custom variables here
theme = "dark"  # light, dark
skin = "indigo_ingot"  # blue, mint, indigo_ingot, etc.
override_serif_with_sans = true
compact_tags = true
favicon = "img/favicon.ico"

remote_repository_url = "https://github.com/sakthivelchinnannan/sakthivelchinnannan.github.io"
remote_repository_git_platform = "auto"
remote_repository_branch = "master"
show_remote_source = true

socials = [
    { name = "github", url = "https://github.com/sakthivelchinnannan/", icon = "github" },
    { name = "bluesky", url = "https://bsky.app/profile/sakthic.bsky.social", icon = "bluesky" },
]

[[taxonomies]]
name = "tags"
